name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: opspulse

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: opspulse
          POSTGRES_PASSWORD: opspulse
          POSTGRES_DB: opspulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opspulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run Alembic migrations against test Postgres
        env:
          DATABASE_URL: postgresql+psycopg2://opspulse:opspulse@localhost:5432/opspulse
        run: alembic upgrade head

      - name: Unit and API tests
        env:
          AI_BACKEND: mock
        run: pytest -v

  docker:
    name: Build, Scan & Verify Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ${{ env.IMAGE_NAME }}:ci -f app/Dockerfile app

      - name: Trivy filesystem scan (dependencies)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: app
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

      - name: Verify non-root user
        run: |
          USER_OUT=$(docker run --rm ${{ env.IMAGE_NAME }}:ci whoami)
          echo "Container user: $USER_OUT"
          test "$USER_OUT" = "opspulse"

  terraform:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init (no backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

  helm:
    name: Helm lint & template
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "v3.16.3"

      - name: helm lint
        run: helm lint helm/opspulse

      - name: helm template
        run: |
          helm template test-release helm/opspulse \
            --set image.repository=example/opspulse \
            --set image.tag=ci \
            --set database.host=example.rds.amazonaws.com
